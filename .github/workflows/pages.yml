name: Publish Pages

on:
  push:
    branches:
      - develop
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        # Include the published docs branch so older schema versions can be kept.
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: pip install mkdocs mkdocs-material mkdocstrings mike

      - name: Prepare schema downloads
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            version_args=(--version "$RELEASE_TAG")
          else
            version_args=(--develop)
          fi
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            python scripts/prepare_schemas.py --docs "${version_args[@]}" --published-ref origin/gh-pages
          else
            python scripts/prepare_schemas.py --docs "${version_args[@]}"
          fi

      - name: Setup Deploy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Deploy Live Documentation
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: mike deploy --push --update-aliases "$RELEASE_TAG" latest

      - name: Deploy Prerelease Documentation
        if: github.event_name == 'release' && github.event.release.prerelease
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: mike deploy --push "$RELEASE_TAG"

      - name: Deploy Development Documentation
        if: startsWith(github.ref, 'refs/heads/develop')
        run: mike deploy --push develop
